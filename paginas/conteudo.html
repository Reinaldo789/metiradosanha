  // EXIBE O CONTEÚDO
  function showTab(id, isNavigatingBack = false) {
    const dados = bancoDeDados[id];
    const areaConteudo = document.getElementById('painel-conteudo');

    if (dados) {
      areaConteudo.innerHTML = `
        <div class="card">
          <h2>${dados.titulo}</h2>
          ${dados.conteudo}
        </div>
      `;
      
      // Atualiza o hash da URL para permitir links diretos
      window.location.hash = id;
    } else {
      areaConteudo.innerHTML = `
        <div class="card">
          <h2>⚠️ Conteúdo não encontrado</h2>
          <p>O item solicitado não está disponível ou foi movido.</p>
        </div>
      `;
    }

    // Regista no histórico apenas se não for uma ação do botão "Voltar"
    if (!isNavigatingBack) {
      if (historicoNavegacao[historicoNavegacao.length - 1] !== id) {
        historicoNavegacao.push(id);
      }
    }

    scrollToTop();
  }

  // BOTÃO INÍCIO (Reseta o histórico e abre o item inicial 'mprop')
  function goHome() {
    historicoNavegacao = ['mprop'];
    showTab('mprop', true);
  }

  // BOTÃO VOLTAR
  function goBack() {
    if (historicoNavegacao.length > 1) {
      historicoNavegacao.pop(); // Remove a página atual do histórico
      const tabAnterior = historicoNavegacao[historicoNavegacao.length - 1];
      showTab(tabAnterior, true);
    } else {
      // Se não houver histórico anterior, tenta voltar na navegação do próprio navegador
      if (window.history.length > 1) {
        window.history.back();
      }
    }
  }

  // ROLAGEM
  function scrollToTop() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  window.onscroll = function() {
    const btn = document.getElementById('scrollTopBtn');
    if (window.scrollY > 150) {
      btn.style.display = 'flex';
    } else {
      btn.style.display = 'none';
    }
  };

  // INICIALIZAÇÃO DA PÁGINA
  function inicializarPagina() {
    // Detecta se a URL traz um hash (ex: #fuse-lamp)
    const hash = window.location.hash.replace('#', '');
    
    if (hash && bancoDeDados[hash]) {
      showTab(hash);
    } else {
      showTab('mprop');
    }
  }

  document.addEventListener("DOMContentLoaded", inicializarPagina);

  // Escuta alterações na URL (caso o utilizador mude o hash manualmente ou via menu)
  window.addEventListener('hashchange', function() {
    const hash = window.location.hash.replace('#', '');
    if (hash && bancoDeDados[hash]) {
      const atual = historicoNavegacao[historicoNavegacao.length - 1];
      if (atual !== hash) {
        showTab(hash);
      }
    }
  });
</script>
