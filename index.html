<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manual Técnico - Sistemas Automotivos</title>
    <!-- CSS externo -->
    <link rel="stylesheet" href="css/estilo.css">

    <!-- 🛠️ ESTILOS DE SEGURANÇA (Garante o visual correto no mobile e computador) -->
    <style>
        /* Garante que os submenus obedeçam estritamente ao clique do JavaScript */
        .submenu { display: none; list-style: none; padding-left: 15px; background-color: #161616; padding-top: 5px; padding-bottom: 5px; }
        .submenu.aberto { display: block !important; }
        
        /* Ajustes mobile obrigatórios */
        @media (max-width: 768px) {
            body { flex-direction: column; padding-top: 60px !important; }
            
            .barra-topo-mobile { display: flex !important; width: 100%; background-color: #111; padding: 15px; border-bottom: 2px solid #ff4500; justify-content: space-between; align-items: center; position: fixed; top: 0; left: 0; z-index: 10000; }
            .barra-topo-mobile h2 { font-size: 18px; color: #ff4500; text-transform: uppercase; }
            .btn-menu-toggle { background: #222; border: 1px solid #ff4500; color: #fff; padding: 8px 12px; font-size: 20px; cursor: pointer; border-radius: 5px; display: block !important; }

            #menu-lateral { position: fixed !important; top: 0; left: 0; height: 100vh !important; width: 280px !important; z-index: 10005; transform: translateX(-100%); transition: transform 0.3s ease !important; background-color: #111 !important; border-right: 3px solid #ff4500 !important; box-shadow: 5px 0 15px rgba(0,0,0,0.5); display: block !important; }
            
            /* Esta classe FORÇA o menu a aparecer na tela quando ativada */
            #menu-lateral.menu-visivel { transform: translateX(0) !important; }
            #menu-lateral .titulo-menu { display: none !important; }

            .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 10002; }
            .overlay.ativo { display: block !important; }
            main { padding: 15px !important; width: 100% !important; }
        }
    </style>
</head>

<body>

    <!-- BARRA SUPERIOR DO CELULAR -->
    <div class="barra-topo-mobile">
        <h2>Manual Técnico 🛠️</h2>
        <button class="btn-menu-toggle" id="btn-menu">☰</button>
    </div>

    <!-- CORTINA DO CELULAR -->
    <div class="overlay" id="overlay"></div>

    <!-- MENU LATERAL -->
    <nav id="menu-lateral">
        <h2 class="titulo-menu">Manual Técnico 🛠️</h2>

        <div class="botoes-navegacao">
            <a href="index.html" class="btn-home">🏠 Home</a>
            <button id="btn-topo" class="btn-topo">⬆️ Início</button>
        </div>

        <!-- SISTEMA DE LUBRIFICAÇÃO -->
        <div class="item-menu">
            <button class="btn-principal" data-menu="lubrificacao">
                <span>Sistema de Lubrificação</span>
                <span class="seta">▼</span>
            </button>
            <ul id="lubrificacao" class="submenu">
                <li><button data-conteudo="tab_lubrificacao">Tabela de Lubrificação</button></li>
                <li><button data-conteudo="luz_pressao">Luz e Pressão</button></li>
            </ul>
        </div>

        <!-- SISTEMA ELÉTRICO -->
        <div class="item-menu">
            <button class="btn-principal" data-menu="eletrico">
                <span>Sistema Elétrico</span>
                <span class="seta">▼</span>
            </button>
            <ul id="eletrico" class="submenu">
                <li><button data-conteudo="fusiveis">Fusíveis e Lâmpadas</button></li>
                <li><button data-conteudo="farol">Farol e Seta</button></li>
            </ul>
        </div>

        <!-- LINHA COMBUSTÍVEL -->
        <div class="item-menu">
            <button class="btn-principal" data-menu="combustivel">
                <span>Linha Combustível</span>
                <span class="seta">▼</span>
            </button>
            <ul id="combustivel" class="submenu">
                <li><button data-conteudo="tanque">Tanque, Filtro, Mang.</button></li>
                <li><button data-conteudo="bomba_eletrica">Bomba Elétrica</button></li>
                <li><button data-conteudo="bomba_engrenagem">Bomba Engrenagem</button></li>
                <li><button data-conteudo="valvula_kuv">Válvula KUV</button></li>
                <li><button data-conteudo="bomba_alta">Bomba Alta Pressão</button></li>
                <li><button data-conteudo="tubo_rail">Tubo Rail</button></li>
            </ul>
        </div>

        <!-- SENSORES E ATUADORES -->
        <div class="item-menu">
            <button class="btn-principal" data-menu="sensores">
                <span>Sensores e Atuadores</span>
                <span class="seta">▼</span>
            </button>
            <ul id="sensores" class="submenu">
                <li><button data-conteudo="valvula_mprop">Válvula MProp</button></li>
                <li><button data-conteudo="sensor_rotacao">Sensor Rotação</button></li>
                <li><button data-conteudo="sensor_fase">Sensor Fase</button></li>
                <li><button data-conteudo="sensor_pres_adm">Sensor Pres. Adm</button></li>
                <li><button data-conteudo="pedal_acelerador">Pedal Acelerador</button></li>
                <li><button data-conteudo="sensor_temp_ecm">Sensor Temp. ECM</button></li>
                <li><button data-conteudo="modulador_turbina">Modulador Turbina</button></li>
                <li><button data-conteudo="sensor_pres_rail">Sensor Pres. Rail</button></li>
                <li><button data-conteudo="bicos_injetores">Bicos Injetores</button></li>
            </ul>
        </div>

        <!-- ADMISSÃO E ESCAPE -->
        <div class="item-menu">
            <button class="btn-principal" data-menu="admissao">
                <span>Admissão e Escape</span>
                <span class="seta">▼</span>
            </button>
            <ul id="admissao" class="submenu">
                <li><button data-conteudo="filtros_mangueiras">Filtros e Mangueiras</button></li>
                <li><button data-conteudo="turbina">Turbina</button></li>
            </ul>
        </div>

        <!-- SISTEMA DE DIREÇÃO -->
        <div class="item-menu">
            <button class="btn-principal" data-menu="direcao">
                <span>Sistema de Direção</span>
                <span class="seta">▼</span>
            </button>
            <ul id="direcao" class="submenu">
                <li><button data-conteudo="bomba_direcao">Bomba de Direção</button></li>
                <li><button data-conteudo="caixa_direcao">Caixa de Direção</button></li>
                <li><button data-conteudo="oleo_direcao">Óleo de Direção</button></li>
            </ul>
        </div>

        <!-- SISTEMAS DE FREIOS -->
        <div class="item-menu">
            <button class="btn-principal" data-menu="freios">
                <span>Sistemas de Freios</span>
                <span class="seta">▼</span>
            </button>
            <ul id="freios" class="submenu">
                <li><button data-conteudo="bomba_vacuo">Bomba de Vácuo</button></li>
                <li><button data-conteudo="freios_traseiros">Freios Traseiros / Mão</button></li>
            </ul>
        </div>
    </nav>

    <!-- CONTEÚDO PRINCIPAL -->
    <main>
        <div class="caixa-conteudo">
            <h1 id="titulo-sistema">Bem-vindo ao Manual Técnico</h1>
            <p id="texto-sistema">Selecione uma categoria e um submenu ao lado para visualizar os dados técnicos e especificações detalhadas de cada componente automotivo.</p>
        </div>
    </main>

    <!-- VÍNCULO DO ARQUIVO JAVASCRIPT EXTERNO -->
    <script src="js/script.js"></script>

    <!-- 🔐 GERENCIADOR EXCLUSIVO DE CLIQUES -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const btnToggleMobile = document.getElementById('btn-menu');
            const painelLateral = document.getElementById('menu-lateral');
            const cortinaEscura = document.getElementById('overlay');

            // Função direta que abre e fecha o menu no celular sem conflitos
            if (btnToggleMobile && painelLateral && cortinaEscura) {
                btnToggleMobile.onclick = function(e) {
                    e.preventDefault();
                    painelLateral.classList.toggle('menu-visivel');
                    cortinaEscura.classList.toggle('ativo');
                };

                cortinaEscura.onclick = function() {
                    painelLateral.classList.remove('menu-visivel');
                    cortinaEscura.classList.remove('ativo');
                };
            }

            // Gerenciador das categorias (Submenus)
            document.querySelectorAll('.btn-principal').forEach(botao => {
                botao.onclick = function(e) {
                    e.preventDefault();
                    const menuId = botao.getAttribute('data-menu');
                    const submenu = document.getElementById(menuId);
                    const seta = botao.querySelector('.seta');
                    
                    if (submenu) {
                        const estaAberto = submenu.style.display === 'block' || submenu.classList.contains('aberto');
                        
                        document.querySelectorAll('.submenu').forEach(s => {
                            s.style.display = 'none';
                            s.classList.remove('aberto');
                        });
                        document.querySelectorAll('.seta').forEach(st => st.innerText = '▼');
                        
                        if (!estaAberto) {
                            submenu.style.setProperty('display', 'block', 'important');
