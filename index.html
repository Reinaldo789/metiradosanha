<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guia Técnico</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- BARRA MOBILE -->
  <header class="mobile-header">
    <button class="mobile-toggle" id="mobile-toggle-btn" aria-label="Abrir Menu">
      <i class="fa-solid fa-bars"></i>
    </button>
    <a href="#" class="logo">
      <i class="fa-solid fa-gears"></i>
      <span>Guia Técnico</span>
    </a>
  </header>

  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <div class="site-wrapper">
    <!-- MENU LATERAL -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <a href="#" class="logo">
          <i class="fa-solid fa-gears"></i>
          <span>Guia Técnico</span>
        </a>
      </div>

      <nav class="sidebar-nav">
        <ul class="nav-list" id="nav-list"></ul>
      </nav>
    </aside>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="main-content">
      <div class="hero-box" id="home-box">
        <h1 class="hero-title-bg">Guia Técnico</h1>
        <div class="hero-title-main">Portal de Especificações</div>
        <p class="hero-sub">Selecione uma categoria no menu lateral para visualizar componentes e testes.</p>
      </div>
      <article class="page-card" id="page-card" hidden></article>
    </main>
  </div>

  <div class="floating-container">
    <button class="float-btn" id="btn-top" title="Voltar ao Topo"><i class="fa-solid fa-arrow-up"></i></button>
  </div>

  <script src="menu.js"></script>
</body>
</html>
