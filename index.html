<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guia Técnico de Lubrificantes & Filtros</title>

  <!-- Ícones (Font Awesome) usados no app.js -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Estilos da página -->

  <style>
    :root {
      --bg: #f1f5f9; --card: #ffffff; --texto: #0f172a; --suave: #64748b;
      --borda: #e2e8f0; --primaria: #1d4ed8; --destaque: #b45309;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--texto); }
    header { background: #0f172a; color: #fff; padding: 20px 16px; }
    header h1 { margin: 0; font-size: 1.3rem; }
    header p { margin: 4px 0 0; color: #cbd5e1; font-size: .9rem; }
    main { max-width: 1000px; margin: 0 auto; padding: 16px; }
    .busca { background: var(--card); border: 1px solid var(--borda); border-radius: 12px; padding: 14px; margin-bottom: 20px; }
    .busca-campo { position: relative; }
    .busca-campo > i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--suave); pointer-events: none; }
    .busca-campo input { width: 100%; padding: 14px 44px 14px 40px; font-size: 1rem; border: 2px solid var(--borda); border-radius: 10px; background: #fff; color: var(--texto); outline: none; }
    .busca-campo input:focus { border-color: var(--primaria); }
    .busca-campo button { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); border: 0; background: #e2e8f0; color: var(--suave); width: 30px; height: 30px; border-radius: 50%; cursor: pointer; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .chip { border: 1px solid var(--borda); background: #f8fafc; color: var(--texto); padding: 6px 14px; border-radius: 999px; font-size: .85rem; cursor: pointer; }
    .chip:hover { border-color: var(--primaria); }
    .chip.ativo { background: var(--primaria); border-color: var(--primaria); color: #fff; }
    .chip small { opacity: .7; margin-left: 4px; }
    .contador { margin: 12px 0 8px; font-size: .8rem; color: var(--suave); }
    .lista-veiculos { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; max-height: 280px; overflow-y: auto; padding: 2px; }
    .veiculo-btn { text-align: left; padding: 10px 12px; border: 1px solid var(--borda); border-radius: 8px; background: #fff; color: var(--texto); font-size: .88rem; cursor: pointer; line-height: 1.3; }
    .veiculo-btn:hover { border-color: var(--primaria); background: #eff6ff; }
    .veiculo-btn.ativo { background: var(--primaria); border-color: var(--primaria); color: #fff; }
    .veiculo-btn small { display: block; color: var(--suave); font-size: .72rem; margin-top: 2px; }
    .veiculo-btn.ativo small { color: #bfdbfe; }
    .sem-resultado { grid-column: 1 / -1; text-align: center; color: var(--suave); padding: 20px; }
    .titulo-modelo { margin: 0 0 12px; font-size: 1.5rem; }
    .secao-titulo { margin: 24px 0 10px; font-size: 1.05rem; color: var(--primaria); }
    .sis { background: var(--card); border: 1px solid var(--borda); border-left: 4px solid var(--primaria); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
    .sis-titulo { font-weight: 700; margin-bottom: 8px; }
    .sis-dados { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin: 0; }
    .sis-dados dt { font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; color: var(--suave); }
    .sis-dados dd { margin: 2px 0 0; font-size: .95rem; }
    .sis-dados dd.destaque { color: var(--destaque); font-weight: 600; }
    .filtros-box { background: var(--card); border: 1px solid var(--borda); border-radius: 10px; padding: 12px; }
    .tabela-container { overflow-x: auto; }
    .tabela-filtros { width: 100%; border-collapse: collapse; font-size: .85rem; white-space: nowrap; }
    .tabela-filtros th, .tabela-filtros td { padding: 8px 10px; border-bottom: 1px solid var(--borda); text-align: left; }
    .tabela-filtros th { background: #f8fafc; font-size: .75rem; text-transform: uppercase; color: var(--suave); }
    .filtro-tag { display: inline-block; padding: 2px 8px; border: 1px solid #818cf8; border-radius: 6px; background: #e0e7ff; font-family: ui-monospace, monospace; }
    .erro { color: #b91c1c; }
    .vazio { text-align: center; color: var(--suave); padding: 40px 10px; }
    footer { text-align: center; color: var(--suave); font-size: .8rem; padding: 20px; }
  </style>

</head>
<body>

  <header>
    <h1><i class="fas fa-oil-can"></i> Guia Técnico de Lubrificantes & Filtros</h1>
    <p>Frota & Oficina — fluidos, capacidades, intervalos e equivalência de filtros</p>
  </header>

  <main>
    <section class="busca">
      <div class="busca-campo">
        <i class="fas fa-search"></i>
        <input id="busca-veiculo" type="search" placeholder="Buscar veículo (ex.: Hilux, Sprinter, Ducato, Gol...)" autocomplete="off" aria-label="Buscar veículo">
        <button id="limpar-busca" type="button" aria-label="Limpar busca" hidden><i class="fas fa-times"></i></button>
      </div>
      <div id="categorias" class="chips"></div>
      <p id="contador" class="contador"></p>
      <div id="lista-veiculos" class="lista-veiculos"></div>
    </section>

    <section id="resultado">
      <p class="vazio">Selecione um veículo acima para ver a ficha técnica.</p>
    </section>
  </main>

  <footer>Confirme sempre com o manual do fabricante antes de executar a manutenção.</footer>

  <!-- app.js importa ./dados/index.js, então precisa ser carregado como módulo -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
