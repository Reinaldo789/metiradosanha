<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#4338ca">
  <title>Manual Automotivo - Filtros e Lubrificantes</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="w">

    <section id="tela-principal" class="tela ativa">
      <div class="home-header">
        <h1>Tabela de Lubrificantes</h1>
        <p>Selecione uma categoria para consultar lubrificantes e filtros.</p>
      </div>
      <div id="grid-home" class="g"></div>
    </section>

    <section id="tela-lista" class="tela">
      <div class="topo-tela"><div class="breadcrumb"></div></div>
      <h2 id="titulo-lista" class="titulo-tela"></h2>
      <div id="grid-lista" class="g"></div>
    </section>

    <section id="tela-conteudo" class="tela">
      <div class="topo-tela"><div class="breadcrumb"></div></div>
      <h1 id="titulo-conteudo" class="titulo-modelo"></h1>
      <div id="conteudo-dinamico"></div>
    </section>

  </div>

  <!-- dados.js = veículos, fluidos e filtros (é o arquivo que você edita para cadastrar). app.js = lógica da página. -->
  <script src="dados.js"></script>
  <script src="app.js"></script>
</body>
</html>
