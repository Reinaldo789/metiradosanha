<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu com Submenu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background: #f8f9fa;
            padding: 30px;
        }

        /* ===== MENU ===== */
        nav {
            background: #2c3e50;
            border-radius: 8px;
            max-width: 700px;
            margin: 0 auto;
            padding: 0 20px;
        }

        nav > ul {
            display: flex;
            list-style: none;
            gap: 5px;
        }

        nav > ul > li {
            padding: 16px 22px;
            color: #ecf0f1;
            cursor: pointer;
            font-weight: 500;
            font-size: 15px;
            position: relative;
            border-radius: 6px;
            transition: background 0.2s;
            user-select: none;
        }

        nav > ul > li:hover {
            background: #34495e;
        }

        /* ===== SUBMENU ===== */
        .submenu {
            position: absolute;
            top: 100%;
            left: 0;
            margin-top: 4px;
            background: #34495e;
            min-width: 200px;
            border-radius: 6px;
            padding: 6px 0;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            
            /* Escondido por padrão */
            display: none;
            opacity: 0;
            transition: opacity 0.2s;
        }

        /* Quando aberto */
        .submenu.open {
            display: block;
            opacity: 1;
        }

        .submenu a {
            display: block;
            padding: 10px 20px;
            color: #ecf0f1;
            text-decoration: none;
            font-size: 14px;
            transition: background 0.15s, padding-left 0.15s;
        }

        .submenu a:hover {
            background: #3d566e;
            padding-left: 26px;
        }

        /* ===== RESPONSIVO ===== */
        @media (max-width: 600px) {
            nav > ul {
                flex-direction: column;
            }
            .submenu {
                position: static;
                box-shadow: none;
                background: #3d566e;
                margin-top: 6px;
            }
        }
    </style>
</head>
<body>

    <nav>
        <ul>
            <li data-menu="produtos">
                Produtos
                <div class="submenu" id="sub-produtos">
                    <a href="#">Eletrônicos</a>
                    <a href="#">Roupas</a>
                    <a href="#">Livros</a>
                </div>
            </li>

            <li data-menu="servicos">
                Serviços
                <div class="submenu" id="sub-servicos">
                    <a href="#">Consultoria</a>
                    <a href="#">Design</a>
                    <a href="#">Suporte</a>
                </div>
            </li>

            <li data-menu="sobre">
                Sobre
                <div class="submenu" id="sub-sobre">
                    <a href="#">Equipe</a>
                    <a href="#">Contato</a>
                </div>
            </li>
        </ul>
    </nav>

    <script>
        // ===== CÓDIGO LIMPO E DIRETO =====
        
        let aberto = null; // Guarda o ID do menu aberto

        // Pega todos os itens do menu
        const menus = document.querySelectorAll('[data-menu]');

        menus.forEach(item => {
            const id = item.dataset.menu;
            const sub = document.getElementById(`sub-${id}`);

            item.addEventListener('click', function(e) {
                e.stopPropagation();

                // Se já está aberto, fecha
                if (aberto === id) {
                    sub.classList.remove('open');
                    aberto = null;
                    return;
                }

                // Fecha o anterior
                if (aberto) {
                    document.getElementById(`sub-${aberto}`).classList.remove('open');
                }

                // Abre o novo
                sub.classList.add('open');
                aberto = id;
            });
        });

        // Fecha ao clicar fora
        document.addEventListener('click', () => {
            if (aberto) {
                document.getElementById(`sub-${aberto}`).classList.remove('open');
                aberto = null;
            }
        });

        // Impede que clique dentro do submenu feche
        document.querySelectorAll('.submenu').forEach(sub => {
            sub.addEventListener('click', e => e.stopPropagation());
        });
    </script>

</body>
</html>
