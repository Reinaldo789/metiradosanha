  <style>
    :root { --primary: #4f46e5; --text-dark: #1f2430; --text-light: #5b6275; --border: #e3e6ef; }

    .w { max-width: 1000px; margin: 0 auto; padding: 40px 16px; }
    
    .home-header { margin-bottom: 32px; text-align: center; }
    h1 { color: #3730a3; font-size: 32px; margin: 0 0 8px; }
    .home-header p { color: var(--text-light); font-size: 16px; margin: 0; }

    .titulo-tela { font-size: 24px; color: #3730a3; margin: 0 0 24px; display: flex; align-items: center; gap: 10px; }
    
    .topo-tela { display: flex; align-items: center; margin-bottom: 24px; }
    .breadcrumb { display: flex; align-items: center; gap: 12px; font-size: 14px; color: var(--text-light); flex-wrap: wrap; }
    .breadcrumb .crumb { background: #fff; border: 1px solid var(--border); padding: 8px 16px; border-radius: 10px; text-decoration: none; color: var(--text-light); cursor: pointer; transition: border-color .15s, color .15s, transform .15s; }
    .breadcrumb .crumb:hover:not(.atual) { border-color: var(--primary); color: #3730a3; transform: translateY(-1px); }
    .breadcrumb .crumb.atual { background: #eef2ff; border-color: #c7d2fe; color: #3730a3; font-weight: 600; cursor: default; }
    .breadcrumb .sep { color: #6b7280; font-size: 18px; font-weight: bold; display: flex; align-items: center; justify-content: center; }

    .g { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .c { display: flex; flex-direction: column; background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 20px; text-decoration: none; color: inherit; cursor: pointer; transition: border-color .15s, transform .15s, box-shadow .15s; }
    .c:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: 0 4px 14px rgba(79,70,229,.12); }
    .c-header { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
    .c-icone { font-size: 24px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: #f0f2f5; }
    .c b { color: #3730a3; font-size: 18px; }
    .c span { font-size: 14px; color: var(--text-light); line-height: 1.4; }
    .c-arrow { margin-top: auto; align-self: flex-end; color: var(--primary); opacity: 0; transition: opacity 0.2s, transform 0.2s; }
    .c:hover .c-arrow { opacity: 1; transform: translateX(4px); }

    .tela { display: none; animation: entrar .35s ease both; }
    .tela.ativa { display: block; }
    .tela.saindo { animation: sair .25s ease both; }
    @keyframes entrar { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes sair { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(-24px); } }

    .card-construcao { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 32px; margin-top: 16px; }
    .card-construcao i { font-size: 48px; color: #a0a7b8; margin-bottom: 16px; display: block; }
    .card-construcao b { font-size: 20px; color: #3730a3; display: block; margin-bottom: 8px; }
    .card-construcao span { color: var(--text-light); font-size: 15px; }

    /* Tabelas */
    .tabela-container { overflow-x: auto; margin-top: 16px; border-radius: 8px; border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; background: #fff; }
    th { background-color: #f0f2f5; color: #3730a3; padding: 12px; border-bottom: 2px solid var(--border); font-weight: 600; white-space: nowrap; }
    td { padding: 12px; border-bottom: 1px solid var(--border); color: var(--text-dark); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover { background-color: #fafafa; }
    
    /* Estilo para os códigos de filtros */
    .filtro-tag { display: inline-block; background: #eef2ff; color: #3730a3; border: 1px solid #c7d2fe; padding: 4px 8px; border-radius: 6px; font-family: monospace; font-weight: 600; font-size: 13px; }

    // =====================================================================
    // 3. LÓGICA DE NAVEGAÇÃO
    // =====================================================================
    let categoriaAtualSlug = '';
    let categoriaAtualTitulo = '';
    let marcaAtual = '';
    let modeloAtual = '';

    function abrirCategoria(titulo, slug, icone, cor) {
      categoriaAtualSlug = slug;
      categoriaAtualTitulo = titulo;
      marcaAtual = ''; 
      
      const tituloLista = document.getElementById('titulo-lista');
      const gridLista = document.getElementById('grid-lista');
      
      tituloLista.innerHTML = `<i class="fa-solid ${icone}" style="color:${cor};"></i> ${titulo}`;
      gridLista.innerHTML = '';
      
      const marcas = bancoDeDados[slug].marcas;
      
      for (const marca in marcas) {
        const card = document.createElement('a');
        card.className = 'c';
        card.onclick = () => abrirMarca(marca);
        card.innerHTML = `
          <div class="c-header">
            <div class="c-icone" style="color:${cor}; background: ${cor}15;"><i class="fa-solid fa-flag"></i></div>
            <b>${marca}</b>
          </div>
          <span>${marcas[marca].length} modelos disponíveis</span>
          <div class="c-arrow"><i class="fa-solid fa-arrow-right"></i></div>
        `;
        gridLista.appendChild(card);
      }
      mudarTela('lista');
    }

    function abrirMarca(marca) {
      marcaAtual = marca;
      const tituloLista = document.getElementById('titulo-lista');
      const gridLista = document.getElementById('grid-lista');
      
      tituloLista.innerHTML = `<i class="fa-solid fa-flag"></i> ${marca}`;
      gridLista.innerHTML = '';
      
      const modelos = bancoDeDados[categoriaAtualSlug].marcas[marca];
      
      modelos.forEach(modelo => {
        const card = document.createElement('a');
        card.className = 'c';
        card.onclick = () => abrirConteudo(modelo);
        card.innerHTML = `
          <div class="c-header">
            <div class="c-icone"><i class="fa-solid fa-wrench"></i></div>
            <b>${modelo}</b>
          </div>
          <span>Ver fluidos e referências de filtros.</span>
          <div class="c-arrow"><i class="fa-solid fa-arrow-right"></i></div>
        `;
        gridLista.appendChild(card);
      });
      mudarTela('lista');
    }

    // --- RENDERIZAÇÃO DA TABELA DE FILTROS ---
    function criarTabelaFiltros(filtros) {
      if (!filtros) return '<p>Dados de filtros não cadastrados.</p>';
      
      const renderLinha = (nome, obj) => {
        if (!obj) return '';
        const getVal = (k) => (obj[k] && obj[k] !== '-') ? `<span class="filtro-tag">${obj[k]}</span>` : '-';
        return `
          <tr>
            <td><b>${nome}</b></td>
            <td>${getVal('original')}</td>
            <td>${getVal('tecfil')}</td>
            <td>${getVal('mann')}</td>
            <td>${getVal('mahle')}</td>
            <td>${getVal('wega')}</td>
            <td>${getVal('fram')}</td>
          </tr>
        `;
      };

      return `
        <div class="tabela-container">
          <table>
            <thead>
              <tr>
                <th>Aplicação</th>
                <th>Original (OEM)</th>
                <th>Tecfil</th>
                <th>Mann</th>
                <th>Mahle</th>
                <th>Wega</th>
                <th>Fram</th>
              </tr>
            </thead>
            <tbody>
              ${renderLinha('Óleo do Motor', filtros.oleo)}
              ${renderLinha('Filtro de Ar', filtros.ar)}
              ${renderLinha('Combustível', filtros.combustivel)}
            </tbody>
          </table>
        </div>
      `;
    }

    function abrirConteudo(modelo) {
      modeloAtual = modelo;
      const tituloConteudo = document.getElementById('titulo-conteudo');
      const containerConteudo = document.getElementById('conteudo-dinamico');
      
      tituloConteudo.textContent = modelo;
      const spec = especificacoesOleos[modelo];
      
      if (spec) {
        containerConteudo.innerHTML = `
          <div class="card-construcao" style="padding: 20px;">
            <p style="margin-top:0; color:#5b6275;">Confira abaixo as especificações de fluidos e os códigos de referência cruzada de filtros:</p>
            <div class="tabela-container">
              <table>
                <thead>
                  <tr>
                    <th>Componente</th>
                    <th>Tipo / Viscosidade</th>
                    <th>Capacidade</th>
                    <th>Intervalo de Troca</th>
                  </tr>
                </thead>
                <tbody>
                  <tr><td><b>Motor</b></td><td>${spec.motor.tipo}</td><td>${spec.motor.qtd}</td><td>${spec.motor.intervalo}</td></tr>
                  <tr><td><b>Câmbio</b></td><td>${spec.cambio.tipo}</td><td>${spec.cambio.qtd}</td><td>${spec.cambio.intervalo}</td></tr>
                  <tr><td><b>Diferencial</b></td><td>${spec.diferencial.tipo}</td><td>${spec.diferencial.qtd}</td><td>${spec.diferencial.intervalo}</td></tr>
                </tbody>
              </table>
            </div>
            
            <h3 style="color: #3730a3; font-size: 18px; margin-top: 32px; margin-bottom: 8px;"><i class="fa-solid fa-filter"></i> Tabela de Referência de Filtros</h3>
            ${criarTabelaFiltros(spec.filtros)}
            
            <p style="font-size: 12px; color: #b45309; margin-top: 16px;">
              <i class="fa-solid fa-triangle-exclamation"></i> <b>Atenção:</b> Os códigos originais e de marcas paralelas podem variar conforme o ano e a versão do motor. Sempre confirme a aplicação no momento da compra.
            </p>
          </div>
        `;
      } else {
        containerConteudo.innerHTML = `
          <div class="card-construcao" style="text-align: center;">
            <i class="fa-solid fa-screwdriver-wrench"></i>
            <b>Conteúdo em construção</b>
            <span>As especificações e filtros para o <strong>${modelo}</strong> estarão disponíveis aqui em breve.</span>
          </div>
        `;
      }
      
      mudarTela('conteudo');
    }

    // =====================================================================
    // 4. SISTEMA DE TROCA DE TELAS E BREADCRUMB
    // =====================================================================
    function mudarTela(idTela) {
      const atual = document.querySelector('.tela.ativa');
      const alvo = document.getElementById('tela-' + idTela);
      
      if (!alvo || atual === alvo) return;

      if (atual) {
        atual.classList.add('saindo');
        setTimeout(() => {
          atual.classList.remove('ativa', 'saindo');
          alvo.classList.add('ativa');
          window.scrollTo({ top: 0, behavior: 'smooth' });
          gerarBreadcrumb(idTela);
        }, 220);
      } else {
        alvo.classList.add('ativa');
        gerarBreadcrumb(idTela);
      }
    }

    function gerarBreadcrumb(telaAtivaId) {
      const container = document.querySelector(`#tela-${telaAtivaId} .breadcrumb`);
      if (!container) return;

      let crumbs = [];
      crumbs.push({ titulo: '🏠 Início', tela: 'principal' });

      if (telaAtivaId === 'lista' || telaAtivaId === 'conteudo') {
        crumbs.push({ titulo: categoriaAtualTitulo, tela: 'lista', acao: () => abrirCategoria(categoriaAtualTitulo, categoriaAtualSlug, 'fa-car', '#4f46e5') });
        
        if (marcaAtual) {
          crumbs.push({ titulo: marcaAtual, tela: 'lista', acao: () => abrirMarca(marcaAtual) });
        }
        
        if (telaAtivaId === 'conteudo') {
          crumbs.push({ titulo: modeloAtual, tela: 'conteudo' });
        }
      }

      container.innerHTML = '';
      crumbs.forEach((item, index) => {
        const isUltimo = index === crumbs.length - 1;
        const crumb = document.createElement('span');
        crumb.className = 'crumb' + (isUltimo ? ' atual' : '');
        crumb.innerHTML = item.titulo;
        
        if (!isUltimo) {
          crumb.onclick = item.acao ? item.acao : () => mudarTela(item.tela);
        }
        container.appendChild(crumb);

        if (!isUltimo) {
          const sep = document.createElement('span');
          sep.className = 'sep';
          sep.textContent = '›';
          container.appendChild(sep);
        }
      });
    }
  </script>
</body>
</html>
